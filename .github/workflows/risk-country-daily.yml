# .github/workflows/risk-country-daily.yml
#
# Riesgo país (EMBI+). Ningún otro workflow lo actualizaba: el script
# fetch_economic_data.py tenía --risk-country pero nadie lo ejecutaba, y el dato
# quedó congelado en el último valor cargado a mano (julio 2026).
name: Riesgo país (diario)

on:
  schedule:
    # Una vez por día, después del cierre del mercado (19:30 en Argentina)
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-risk-country:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Fetch riesgo país
        working-directory: backend
        run: python scripts/fetch_economic_data.py --risk-country
