name: Fetch Inflation Data

on:
  schedule:
    - cron: '0 10 11-18 * *' # Every day at 10 AM UTC, only between the 11th and 18th of the month
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch_inflation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Change this if you use another python version
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inflation fetching script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python scripts/fetch_economic_data.py --inflation
