# .github/workflows/indec-sync.yml
name: Datos INDEC (diario)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Backfill completo (ignora la ventana incremental)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-indec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Sincronizar datos del INDEC
        working-directory: backend
        run: python scripts/fetch_indec_data.py ${{ inputs.full && '--full' || '' }}
